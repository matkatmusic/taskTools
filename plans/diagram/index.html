<!doctype html>
<meta charset="utf-8">
<title>pipeline.mmd</title>
<style>
  body { margin: 0; display: grid; place-items: center; min-height: 100vh; background: #fff; }
  @media (prefers-color-scheme: dark) { body { background: #16181b; } }
  #d { max-width: 100%; overflow: auto; padding: 2rem; }
  #err { position: fixed; top: 0; left: 0; right: 0; background: #a52a1e; color: #fff;
         font: 13px/1.5 ui-monospace, monospace; padding: .5rem 1rem; white-space: pre-wrap; }
  #err:empty { display: none; }
</style>
<div id="err"></div>
<div id="d"></div>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs'
  const dark = matchMedia('(prefers-color-scheme: dark)').matches
  mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default' })
  let last = null
  setInterval(async () => {
    const src = await (await fetch('pipeline.mmd?t=' + Date.now())).text()
    if (src === last) return
    last = src
    try {
      const { svg } = await mermaid.render('g' + Date.now(), src)
      d.innerHTML = svg
      err.textContent = ''
    } catch (e) { err.textContent = e.message }
  }, 400)
</script>
