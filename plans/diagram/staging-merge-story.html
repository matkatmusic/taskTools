<title>Two Tasks At Once</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F4F7; --panel:#FFFFFF; --ink:#1B2430; --muted:#5B6672; --line:#CBD2DA;
  --root:#3557C7; --root-soft:#E3E9FA; --sub:#1F8A70; --sub-soft:#DDF3EC;
  --deep:#6B5CA5; --deep-soft:#ECE8F7;
  --task:#7B8794; --task-soft:#EDF0F3; --bad:#C7361F; --bad-soft:#FBE4DF; --ghost:#A9B2BC;
  --user:#9A5B00; --user-soft:#FBEBD0;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12161C; --panel:#1A2029; --ink:#E6EAF0; --muted:#8B96A3; --line:#33404D;
  --root:#7A9BFF; --root-soft:#1F2A4A; --sub:#4FC9A8; --sub-soft:#173A32;
  --deep:#A99BE0; --deep-soft:#2A2440;
  --task:#8F9BA8; --task-soft:#242C36; --bad:#FF7A5C; --bad-soft:#4A241C; --ghost:#5B6672;
  --user:#E0A23A; --user-soft:#3D2E12;
}}
:root[data-theme="dark"]{
  --bg:#12161C; --panel:#1A2029; --ink:#E6EAF0; --muted:#8B96A3; --line:#33404D;
  --root:#7A9BFF; --root-soft:#1F2A4A; --sub:#4FC9A8; --sub-soft:#173A32;
  --deep:#A99BE0; --deep-soft:#2A2440;
  --task:#8F9BA8; --task-soft:#242C36; --bad:#FF7A5C; --bad-soft:#4A241C; --ghost:#5B6672;
  --user:#E0A23A; --user-soft:#3D2E12;
}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding-inline:clamp(16px,4vw,48px);padding-block:32px 64px;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
header{max-width:72ch;margin-bottom:20px}
h1{font-size:28px;font-weight:600;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
header p{margin:0 0 8px;color:var(--muted)}
.picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 6px}
.picker button{font:inherit;font-size:13px;padding:6px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;cursor:pointer}
.picker button[aria-pressed="true"]{background:var(--root);border-color:var(--root);color:var(--panel)}
.picker button:focus-visible{outline:2px solid var(--root);outline-offset:2px}
.todo{border:2px dashed var(--line);border-radius:6px;padding:24px;color:var(--muted);margin:6px 18px 18px}
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;font-size:13px;color:var(--muted);margin:14px 0 22px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid currentColor}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.controls{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.controls button{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;cursor:pointer}
.controls button:focus-visible,#slider:focus-visible{outline:2px solid var(--root);outline-offset:2px}
#slider{width:100%;accent-color:var(--root);margin:0}
.ticks{position:relative;height:16px;margin:0 8px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);grid-column:2}
.ticks span{position:absolute;top:0;transform:translateX(-50%)}
.frame-head{display:flex;gap:14px;align-items:baseline;padding:14px 18px 0;flex-wrap:wrap}
.frame-head .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.frame-head h2{font-size:18px;font-weight:600;margin:0;text-wrap:balance}
.frame-body{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0 18px;padding:6px 18px 16px}
@media (max-width:960px){.frame-body{grid-template-columns:1fr}}
.fig{overflow-x:auto}
svg{display:block;width:100%;height:auto;min-width:700px;font-family:"IBM Plex Mono",monospace}
.notes{font-size:13.5px;color:var(--ink)}
.notes p{margin:8px 0}
.notes ol{margin:6px 0 0;padding-left:20px}
.notes li{margin:4px 0}
.events{list-style:none;padding:0;margin:0 0 8px;max-height:220px;overflow-y:auto;font-size:12.5px;border:1px solid var(--line);border-radius:4px}
.events li{padding:3px 8px;border-bottom:1px solid var(--line);color:var(--muted)}
.events li:last-child{border-bottom:0}
.events li.now{color:var(--ink);font-weight:600;background:var(--task-soft)}
.events li.now::before{content:"> "}
.events li.now::after{content:" <"}
.events{font-family:"IBM Plex Mono",monospace;font-size:12px;max-height:420px}
.events li .t{font-family:"IBM Plex Mono",monospace;font-size:11px;margin-right:6px;color:var(--muted)}
.notes code{font-family:"IBM Plex Mono",monospace;font-size:12.5px;background:var(--task-soft);padding:1px 5px;border-radius:3px}
.ledger{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;font-variant-numeric:tabular-nums}
.ledger th,.ledger td{text-align:left;padding:3px 8px 3px 0;border-bottom:1px solid var(--line);vertical-align:top}
.ledger th{color:var(--muted);font-weight:500}
.ledger td.mono{font-size:12px}
.bad{color:var(--bad)}
.ok{color:var(--sub)}
.fill{border:2px dashed var(--line);border-radius:6px;padding:14px;color:var(--muted);margin-top:10px}
.fill .blank{display:inline-block;min-width:9ch;border-bottom:1.5px dashed var(--ink);margin:0 4px}
.foot{font-size:12.5px;color:var(--muted);padding:0 18px 14px}
.foot:empty{display:none}
</style>

<header>
  <h1>Two Tasks At Once</h1>
  <div class="picker" id="scenario" role="group" aria-label="Repository shape">
    <button type="button" data-key="single" aria-pressed="true">no submodules</button>
    <button type="button" data-key="one" aria-pressed="false">one submodule</button>
    <button type="button" data-key="nested" aria-pressed="false">nested submodules</button>
    <button type="button" data-key="reveng" aria-pressed="false">RevEng</button>
  </div>
  <div id="intro"></div>
</header>

<div class="legend" id="legend"></div>

<section class="stage">
  <div class="controls">
    <button id="prev" type="button" aria-label="Previous frame">◀</button>
    <input id="slider" type="range" min="1" max="8" value="1" step="1" aria-label="Frame">
    <button id="next" type="button" aria-label="Next frame">▶</button>
    <div class="ticks" id="ticks"></div>
  </div>
  <div class="frame-head"><span class="n" id="fnum"></span><h2 id="ftitle"></h2></div>
  <div class="frame-body">
    <div class="fig" id="fig"></div>
    <aside class="notes" id="notes"></aside>
  </div>
  <p class="foot" id="foot"></p>
</section>

<script>
// ponytail: each scenario owns its data and its render(i); the viewer only swaps them.
const COL = (c) => 78 + c * 108;

function pill(x, y, r, k, strongColor) {
  const w = r.length * 6.6 + 12; const ry = y - 20 - k * 17;
  const strong = r.startsWith("staging"); const usr = r === "Layer3-9" || r === "main" || r === "HEAD" || r === "checkout";
  const fill = strong ? strongColor : usr ? "var(--user-soft)" : "var(--task-soft)";
  const tc = strong ? "var(--panel)" : usr ? "var(--user)" : "var(--ink)";
  return `<rect x="${x - w / 2}" y="${ry - 10}" width="${w}" height="14" rx="3" fill="${fill}" stroke="${strong ? strongColor : usr ? 'var(--user)' : 'var(--line)'}" stroke-width="1"/><text x="${x}" y="${ry + 1}" font-size="10.5" text-anchor="middle" fill="${tc}" font-weight="500">${r}</text>`;
}
function edgePath(A, B) {
  return A.y === B.y ? `M${A.x},${A.y} L${B.x},${B.y}` : `M${A.x},${A.y} C${A.x + 50},${A.y} ${B.x - 50},${B.y} ${B.x},${B.y}`;
}
function linkLine(A, B, stroke, extra) {
  return `<line x1="${A.x}" y1="${A.y + 12}" x2="${B.x}" y2="${B.y - 13}" stroke="${stroke}" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arr)" style="color:${stroke}" ${extra || ""}/>`;
}
const ARROW = `<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>`;

// ---------------------------------------------------------------- event engine
// ponytail: a scenario is a sorted event list; each event is one slider step; commits take columns in order.
const REPO = { P: "Parent", S: "Submodule", SS: "Deep submodule" };
function phrase(e) {
  return ({
    init: "Initial start",
    create: `Create '${e.arg}'`,
    code: "Commit code change",
    upSub: `Commit submodule pointer → ${e.arg}`,
    mrg: `Merge '${e.arg}' into '${e.branch}'`,
    rebase: `Rebase onto '${e.arg}'`,
    noop: `Rebase onto '${e.arg}', nothing to do`,
    move: `Move to ${e.arg}`,
    skip: "Merge skipped, nothing new",
    delete: `Delete '${e.arg}'`,
    fail: `Merge '${e.arg}' into '${e.branch}' FAILS`,
  })[e.what];
}
const HEADROOM = 100; // room above the first row for up to five stacked ref pills
function branchPath(A, B, down) {
  if (A.y === B.y) return `M${A.x},${A.y} L${B.x},${B.y}`;
  if (down) return `M${A.x},${A.y} C${A.x + 40},${A.y} ${A.x + 40},${B.y} ${A.x + 80},${B.y} L${B.x},${B.y}`;
  return `M${A.x},${A.y} L${B.x - 80},${A.y} C${B.x - 40},${A.y} ${B.x - 40},${B.y} ${B.x},${B.y}`;
}
function eventsScenario(cfg) {
  const { lanes, events, intro, legend, foot, colStep } = cfg;
  const commits = events.filter(e => e.type === "commit");
  const colOf = new Map(commits.map((e, k) => [e.id, k]));
  const W = 78 + colStep * Math.max(0, commits.length - 1) + 90;
  let top = 8;
  const HEADROOM = 100; // room for up to five stacked ref pills above the first row
  for (const L of lanes) { L.top = top; L.h = 30 + HEADROOM + 58 * L.rows.length; top += L.h + 14; }
  const H = top;
  const laneOf = Object.fromEntries(lanes.map(L => [L.key, L]));
  const rowIdx = (n) => laneOf[n.lane].rows.indexOf(n.branch);
  const pos = (n) => ({ x: 78 + colStep * colOf.get(n.id), y: laneOf[n.lane].top + 28 + HEADROOM + 58 * rowIdx(n) });
  const color = (n) => ({ user: "var(--user)", fail: "var(--bad)", task: "var(--task)", upSub: "var(--task)" })[n.kind] || laneOf[n.lane].color;

  function state(i) {
    const nodes = []; const refs = {}; let bad = [];
    for (const L of lanes) refs[L.key] = {};
    for (const e of events.slice(0, i)) {
      if (e.type === "commit") { nodes.push(e); for (const r of (e.refs || [])) refs[e.lane][r] = e.id; }
      if (e.set) for (const [lane, m] of Object.entries(e.set)) Object.assign(refs[lane], m);
      if (e.del) for (const [lane, names] of Object.entries(e.del)) for (const r of names) delete refs[lane][r];
      if (e.bad) bad = e.bad;
    }
    const byId = new Map(nodes.map(n => [n.id, n]));
    const reached = new Set();
    for (const L of lanes) {
      const stack = Object.values(refs[L.key]);
      while (stack.length) { const id = stack.pop(); if (reached.has(id)) continue; reached.add(id); for (const p of (byId.get(id)?.parents || [])) stack.push(p); }
    }
    return { nodes, refs, bad, byId, isGhost: (n) => n.kind !== "fail" && !reached.has(n.id) };
  }

  function render(i) {
    const { nodes, refs, bad, byId, isGhost } = state(i);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${events[i - 1].text}">${ARROW}`;
    for (const L of lanes) {
      s += `<rect x="0" y="${L.top}" width="${W}" height="${L.h}" rx="4" fill="${L.soft}" opacity=".45"/>
            <text x="12" y="${L.top + 18}" font-size="12" fill="${L.color}" font-weight="500">${L.label}</text>`;
      L.rows.forEach((r, k) => { s += `<text x="12" y="${L.top + 28 + HEADROOM + 58 * k + 4}" font-size="10.5" fill="var(--muted)">${r}</text>`; });
    }
    for (const n of nodes) for (const p of (n.parents || [])) {
      const np = byId.get(p); if (!np) continue;
      s += `<path d="${branchPath(pos(np), pos(n), rowIdx(n) > rowIdx(np))}" fill="none" stroke="${isGhost(n) ? "var(--ghost)" : color(n)}" stroke-width="2" opacity="${isGhost(n) ? .35 : .9}"/>`;
    }
    for (const n of nodes) {
      if (!n.link) continue; const t = byId.get(n.link); if (!t) continue;
      s += linkLine(pos(n), pos(t), isGhost(n) ? "var(--ghost)" : "var(--muted)", 'opacity=".8"');
    }
    for (const [a, b, lbl] of bad) {
      const A = pos(byId.get(a)), B = pos(byId.get(b));
      s += linkLine(A, B, "var(--bad)", 'stroke-width="1.6" stroke-dasharray="3 5"');
      s += `<text x="${(A.x + B.x) / 2 + 6}" y="${(A.y + B.y) / 2}" font-size="11" fill="var(--bad)">${lbl}</text>`;
    }
    const ev = events[i - 1];
    const ringId = ev.type === "commit" ? ev.id : (refs[ev.lane][ev.branch] ?? state(i - 1).refs[ev.lane][ev.branch]);
    for (const n of nodes) {
      const { x, y } = pos(n); const c = isGhost(n) ? "var(--ghost)" : color(n);
      if (n.id === ringId) s += `<circle cx="${x}" cy="${y}" r="15" fill="none" stroke="${c}" stroke-width="1.5" opacity=".5"/>`;
      if (n.kind === "mrg") s += `<rect x="${x - 8}" y="${y - 8}" width="16" height="16" transform="rotate(45 ${x} ${y})" fill="var(--panel)" stroke="${c}" stroke-width="2.5"/>`;
      else if (n.kind === "upSub") s += `<circle cx="${x}" cy="${y}" r="8" fill="var(--panel)" stroke="${c}" stroke-width="2.5"/>`;
      else if (n.kind === "fail") s += `<rect x="${x - 8}" y="${y - 8}" width="16" height="16" transform="rotate(45 ${x} ${y})" fill="var(--bad-soft)" stroke="${c}" stroke-width="2.5" stroke-dasharray="3 2"/><path d="M${x - 5},${y - 5} L${x + 5},${y + 5} M${x + 5},${y - 5} L${x - 5},${y + 5}" stroke="${c}" stroke-width="2.5"/>`;
      else s += `<circle cx="${x}" cy="${y}" r="8" fill="${n.kind === "task" || isGhost(n) ? "var(--panel)" : c}" stroke="${c}" stroke-width="2.5" ${n.kind === "task" ? 'stroke-dasharray="3 2"' : ""} ${isGhost(n) ? 'stroke-dasharray="2 3"' : ""}/>`;
      s += `<text x="${x}" y="${y + 24}" font-size="11" text-anchor="middle" fill="${isGhost(n) ? "var(--ghost)" : "var(--ink)"}" font-weight="500">${n.id}</text>`;
      if (n.note) s += `<text x="${x}" y="${y + 37}" font-size="10" text-anchor="middle" fill="${n.kind === "fail" ? "var(--bad)" : "var(--muted)"}">${n.note}</text>`;
      const pills = Object.entries(refs[n.lane]).filter(([, id]) => id === n.id).map(([r]) => r);
      pills.forEach((r, k) => { s += pill(x, y, r, k, laneOf[n.lane].color); });
    }
    return s + `</svg>`;
  }

  function notes(i) {
    const list = events.map((e, k) => `<li class="${k === i - 1 ? "now" : ""}">${String(k + 1).padStart(2, "0")} ${REPO[e.lane]}, ${e.branch}, ${phrase(e)}</li>`).join("");
    return `<ol class="events">${list}</ol>${events[i - 1].detail || ""}`;
  }
  return {
    intro, legend, foot, count: events.length,
    num: (i) => `Event ${i} of ${events.length}`,
    title: (i) => events[i - 1].text,
    notes, ledger: () => ({}), render,
  };
}

// ---------------------------------------------------------------- single repo
const single = eventsScenario({
  colStep: 104,
  lanes: [{ key: "P", label: "PARENT REPO", color: "var(--root)", soft: "var(--root-soft)", rows: ["main", "staging", "task-A", "task-B"] }],
  events: [
    { type: "commit", id: "init:P:code", lane: "P", branch: "main", what: "init", row: "A", kind: "commit", parents: [], refs: ["main", "HEAD"], note: "start", text: "Start. main is at init:P:code. No staging yet." },
    { type: "ref", lane: "P", branch: "main", what: "create", arg: "staging", set: { P: { staging: "init:P:code" } }, text: "T_A spawn: git branch staging. Cut from HEAD." },
    { type: "ref", lane: "P", branch: "main", what: "create", arg: "task-A", set: { P: { "task-A": "init:P:code" } }, text: "T_A spawn: git worktree add -B task-A wt-A staging. Reset-point ref written." },
    { type: "ref", lane: "P", branch: "main", what: "create", arg: "task-B", set: { P: { "task-B": "init:P:code" } }, text: "T_B spawn: git worktree add -B task-B wt-B staging. Reset-point ref written." },
    { type: "commit", id: "T_A:P:code", lane: "P", branch: "task-A", what: "code", row: "B", kind: "task", parents: ["init:P:code"], refs: ["task-A"], text: "T_A commits its code change in wt-A." },
    { type: "commit", id: "T_B:P:code", lane: "P", branch: "task-B", what: "code", row: "C", kind: "task", parents: ["init:P:code"], refs: ["task-B"], text: "T_B commits its code change in wt-B." },
    { type: "ref", lane: "P", branch: "task-A", what: "noop", arg: "staging", text: "T_A merge step 1: git rebase staging in wt-A. staging is still the start, nothing to do." },
    { type: "commit", id: "T_A:P:mrg", lane: "P", branch: "staging", what: "mrg", arg: "task-A", row: "A", kind: "mrg", parents: ["init:P:code", "T_A:P:code"], refs: ["staging"], text: "T_A merge step 2: git merge --no-ff task-A on staging." },
    { type: "ref", lane: "P", branch: "task-A", what: "delete", arg: "task-A", del: { P: ["task-A"] }, text: "T_A cleanup: worktree wt-A removed, branch task-A deleted." },
    { type: "commit", id: "T_B:P:code′", lane: "P", branch: "task-B", what: "rebase", arg: "staging", row: "C", kind: "task", parents: ["T_A:P:mrg"], refs: ["task-B"], note: "replayed", text: "T_B merge step 1: git rebase staging in wt-B. T_B:P:code is replayed on top of T_A:P:mrg. The old commit is unreachable now." },
    { type: "commit", id: "T_B:P:mrg", lane: "P", branch: "staging", what: "mrg", arg: "task-B", row: "A", kind: "mrg", parents: ["T_A:P:mrg", "T_B:P:code′"], refs: ["staging"], text: "T_B merge step 2: git merge --no-ff task-B on staging." },
    { type: "ref", lane: "P", branch: "task-B", what: "delete", arg: "task-B", del: { P: ["task-B"] }, text: "T_B cleanup: worktree wt-B removed, branch task-B deleted." },
    { type: "commit", id: "user:P:code", lane: "P", branch: "main", what: "code", row: "L", kind: "user", parents: ["init:P:code"], refs: ["main", "HEAD"], text: "You commit on main. main and staging have diverged now." },
    { type: "commit", id: "T_C:P:mrg", lane: "P", branch: "staging", what: "mrg", arg: "main", row: "A", kind: "mrg", parents: ["T_B:P:mrg", "user:P:code"], refs: ["staging"], note: "staging ← main", text: "T_C spawn: staging and HEAD diverged. Temp worktree at staging, git merge --no-edit HEAD, then git branch -f staging. Works: no submodules." },
    { type: "ref", lane: "P", branch: "staging", what: "create", arg: "task-C", set: { P: { "task-C": "T_C:P:mrg" } }, text: "T_C spawn: git worktree add -B task-C wt-C staging." },
  ],
  intro: `<p>One git repository. Your branch is <span class="mono">main</span>. Two tasks, A and B, run at the same time. Task A merges first. Drag the slider, or press ← →, to step through the git events one by one.</p>
  <p>Commit names are <span class="mono">&lt;Task&gt;:&lt;Where&gt;:&lt;What&gt;</span>. Task is T_A, T_B, T_C, init, or user. Where is P for the parent repo. What is code, upSub, or mrg. A faded circle is a commit that no branch reaches any more.</p>`,
  legend: `<span><i class="dot" style="color:var(--root)"></i> commit on staging</span>
  <span><i class="dot" style="color:var(--task);border-style:dashed"></i> commit on a task branch</span>
  <span><i class="dot" style="color:var(--user)"></i> your own commit on main</span>
  <span><i class="dot" style="color:var(--ghost);border-style:dotted"></i> unreachable, after a rebase</span>
  <span class="mono" style="font-size:12px">◆ mrg &nbsp; ● code &nbsp; ring = where this event happens</span>`,
  foot: ``,
});

// Old frame renderer, replaced by the event-list RevEng below.
// ---------------------------------------------------------------- RevEng + jfred, nested
// const reveng = (() => {
//   const LANES = {
//     root: { rows: { L: 34, A: 92, B: 150, C: 208 }, top: 8, h: 232, color: "var(--root)", soft: "var(--root-soft)", label: "ROOT · RevEng" },
//     sub:  { rows: { L: 290, A: 348, B: 406, C: 464 }, top: 266, h: 226, color: "var(--sub)", soft: "var(--sub-soft)", label: "SUBMODULE · jfred" },
//     plug: { rows: { A: 560 }, top: 514, h: 76, color: "var(--deep)", soft: "var(--deep-soft)", label: "SUBMODULE · jfred/jfredToolsPlugin" },
//     tmux: { rows: { A: 658 }, top: 612, h: 76, color: "var(--deep)", soft: "var(--deep-soft)", label: "SUBMODULE · jfred/jfredToolsPlugin/external/tmux_lib" },
//   };
//   const W = 1140, H = 700;

let current = "single";
let S = SCENARIOS[current];

function show(i) {
  document.getElementById("fnum").textContent = S.num(i);
  document.getElementById("ftitle").textContent = S.title(i);
  document.getElementById("fig").innerHTML = S.render(i);
  const led = Object.entries(S.ledger(i)).map(([k, v]) => `<tr><th>${k}</th><td class="mono">${v}</td></tr>`).join("");
  document.getElementById("notes").innerHTML = led ? `${S.notes(i)}<table class="ledger"><tbody>${led}</tbody></table>` : S.notes(i);
  slider.value = i;
}
function load() {
  S = SCENARIOS[current];
  for (const b of picker.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.key === current));
  document.getElementById("intro").innerHTML = S.intro;
  document.getElementById("legend").innerHTML = S.legend;
  document.getElementById("foot").innerHTML = S.foot;
  slider.max = S.count;
  document.getElementById("ticks").innerHTML = Array.from({ length: S.count }, (_, k) => `<span style="left:${(100 * k) / (S.count - 1)}%">${k + 1}</span>`).join("");

}

document.getElementById("next").addEventListener("click", () => show(Math.min(S.count, Number(slider.value) + 1)));

  if (e.key === "ArrowRight") show(Math.min(S.count, Number(slider.value) + 1));
});
